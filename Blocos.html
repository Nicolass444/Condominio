<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Cadastrar Bloco</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --primary:#2563eb;
      --primary-700:#1d4ed8;
      --text:#0f172a;
      --muted:#6b7280;
      --border:#e5e7eb;
      --ring:#bfdbfe;
      --shadow:0 10px 25px rgba(2,6,23,.08);
      --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:linear-gradient(180deg,#f0f4ff 0%,#f6f8ff 40%, var(--bg) 100%);
      color:var(--text); display:grid; place-items:center; padding:24px;
    }
    .container{
      width:min(920px, 100%);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    header{
      padding:22px 26px;
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      background: #fff;
    }
    header h1{font-size:20px; margin:0}
    header a{
      color:var(--primary); text-decoration:none; font-weight:600;
      padding:10px 14px; border:1px solid var(--border); border-radius:10px;
      transition:.2s;
    }
    header a:hover{background:#f8fafc}
    main{padding:26px}
    .description{color:var(--muted); margin:0 0 18px 0}

    form{
      display:grid; gap:18px;
    }
    .grid{
      display:grid; gap:16px;
      grid-template-columns: repeat(6, 1fr);
    }
    .col-3{grid-column: span 3}
    .col-2{grid-column: span 2}
    .col-1{grid-column: span 1}
    .col-6{grid-column: span 6}

    label{font-weight:600; font-size:14px; display:block; margin-bottom:6px}
    .field{
      display:flex; flex-direction:column;
    }
    input, textarea{
      width:100%;
      padding:12px 14px;
      border:1px solid var(--border);
      border-radius:10px;
      font-size:14px;
      outline:none; transition:border-color .15s, box-shadow .15s, background .2s;
      background:#fff;
    }
    textarea{min-height:90px; resize:vertical}
    input:focus, textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 4px var(--ring);
    }
    .hint{font-size:12px; color:var(--muted); margin-top:6px}

    .actions{
      display:flex; gap:12px; flex-wrap:wrap; margin-top:10px;
    }
    button{
      appearance:none; border:0; cursor:pointer; font-weight:700;
      padding:12px 18px; border-radius:10px; font-size:14px;
    }
    .btn-primary{
      background:var(--primary); color:#fff;
    }
    .btn-primary:hover{background:var(--primary-700)}
    .btn-ghost{
      background:#f8fafc; color:var(--text); border:1px solid var(--border);
    }
    .row{
      display:flex; align-items:center; gap:14px; color:var(--muted); font-size:13px;
    }

    @media (max-width: 820px){
      .grid{grid-template-columns: 1fr 1fr}
      .col-3{grid-column: span 2}
      .col-2{grid-column: span 1}
      .col-1{grid-column: span 1}
      .col-6{grid-column: span 2}
    }
    @media (max-width: 540px){
      .grid{grid-template-columns: 1fr}
      .col-3,.col-2,.col-1,.col-6{grid-column: 1}
      header{flex-direction:column; align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="container" role="region" aria-label="Cadastro de Blocos">
    <header>
      <h1>🧱 Cadastrar Bloco</h1>
      <a href="index.html">⬅ Voltar para o início</a>
    </header>

    <main>
      <p class="description">
        Preencha os dados do bloco. Somente o <strong>nome</strong> é obrigatório; os demais campos são opcionais e podem ser atualizados depois.
      </p>

     
      <form action="/cadastrar-bloco" method="POST" novalidate>
        <div class="grid">
          <div class="field col-3">
            <label for="nome">Nome do Bloco *</label>
            <input id="nome" name="nome" type="text" placeholder="Ex.: A, B, C" required maxlength="100" />
            <div class="hint">Obrigatório. Precisa ser único.</div>
          </div>

          <div class="field col-3">
            <label for="sindico">Síndico</label>
            <input id="sindico" name="sindico" type="text" placeholder="Nome do síndico" maxlength="100" />
          </div>

          <div class="field col-2">
            <label for="telefone">Telefone do Síndico</label>
            <input id="telefone" name="telefone" type="tel" inputmode="tel" placeholder="(11) 99999-9999" maxlength="20" />
          </div>

          <div class="field col-2">
            <label for="quantidade_ap">Qtd. de Apartamentos</label>
            <input id="quantidade_ap" name="quantidade_ap" type="number" min="0" step="1" placeholder="Ex.: 24" />
          </div>

          <div class="field col-2">
            <label for="pavimentos">Nº de Pavimentos</label>
            <input id="pavimentos" name="pavimentos" type="number" min="0" step="1" placeholder="Ex.: 6" />
          </div>

          <div class="field col-6">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" placeholder="Observações adicionais do bloco (opcional)"></textarea>
          </div>
        </div>

        <div class="actions">
          <button class="btn-primary" type="submit">Salvar bloco</button>
          <a class="btn-ghost" href="/blocos">Ver blocos</a>
        </div>

        <div class="row" aria-live="polite">
          <span>Dica:</span>
          <span>Se você já cadastrou um bloco com este nome, o sistema avisará que é duplicado.</span>
        </div>
      </form>
    </main>
  </div>

  <script>

    document.querySelector('form')?.addEventListener('submit', (e) => {
      const form = e.currentTarget;
     
      ['nome','sindico','telefone','descricao'].forEach(id => {
        const el = form.querySelector('#'+id);
        if (el && typeof el.value === 'string') el.value = el.value.trim();
      });
    });
  </script>
</body>
</html>
